name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts is deliberate: the MCP Vite plugin regenerates the
      # edge function on install; CI validates source, it does not deploy.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check (TypeScript + ESLint + tests)
        run: npm run check

      - name: Build
        run: npm run build
